services:
  - type: web
    name: nexo-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm run migrate && node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Set these manually in Render dashboard:
      # DATABASE_URL  → from neon.tech
      # REDIS_URL     → from upstash.com
      # All other keys from .env.example

  - type: worker
    name: nexo-worker
    runtime: node
    buildCommand: npm ci
    startCommand: node workers/index.js
    envVars:
      - key: NODE_ENV
        value: production
      # DATABASE_URL and REDIS_URL inherited from dashboard env group
