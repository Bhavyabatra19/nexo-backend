services:
  - type: web
    name: nexo-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm run migrate && node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexo-redis
          property: connectionString

  - type: worker
    name: nexo-worker
    runtime: node
    buildCommand: npm ci
    startCommand: node workers/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexo-redis
          property: connectionString

databases:
  - name: nexo-db
    plan: free

  - name: nexo-redis
    plan: free
    ipAllowList: []
